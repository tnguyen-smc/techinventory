<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office tech inventory</title>
<style>
:root{--bg:#e9ecea;--ink:#1b2220;--muted:#65706b;--line:#d3d9d5;--panel:#fbfcfb;--tape:#2c58e8;--mark:#ffd426;--danger:#c6372c;
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{height:38px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
button:hover:not(:disabled){border-color:#aab4af}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--tape);border-color:var(--tape);color:#fff;font-weight:600}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;min-height:38px;-webkit-user-select:text;user-select:text}
textarea{resize:vertical}

/* header */
header{position:fixed;z-index:30;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
header>*{pointer-events:auto}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.brand span{font-weight:500;color:var(--muted);font-size:13px}
.search{position:relative;flex:1;max-width:560px}
.search input{height:42px;padding:0 14px}
#results{display:none;position:absolute;top:48px;left:0;right:0;max-height:64vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(20,30,25,.18);padding:4px}
#results.on{display:block}
#results .none{padding:14px;color:var(--muted)}
.hitrow{display:flex;gap:12px;width:100%;height:auto;text-align:left;border:0;border-radius:6px;padding:10px;background:transparent;align-items:center}
.hitrow:hover,.hitrow.sel{background:#eef2ef}
.hitrow .t{font-weight:600}
.hitrow mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.hitrow .s{color:var(--muted);font-size:13px;margin-top:1px}
.hitrow .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-block;font-size:12px;padding:2px 7px;border-radius:5px;background:#e3e8e5}
.chip.tape{background:var(--tape);color:#fff}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
#sync{display:flex;align-items:center;gap:7px;font-size:13px}
#sync i{width:8px;height:8px;border-radius:50%;background:#9aa5a0;display:block}
#sync.ok i{background:#2f9e5b}#sync.busy i{background:var(--mark)}#sync.err i{background:var(--danger)}

/* breadcrumbs, dock, edit bar */
#crumbs{position:fixed;z-index:20;top:62px;left:10px;display:flex;gap:4px;align-items:center;font-size:14px}
#crumbs button{height:30px;padding:0 10px;font-size:13.5px}
#crumbs span{color:var(--muted)}#crumbs b{padding:0 6px}
#dock{position:fixed;z-index:20;left:10px;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;pointer-events:none}
#dock>*{pointer-events:auto}
#dock .chips{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 330px)}
#dock .chips button{height:34px;font-size:13px}
#dock .chips button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
#dock .hint{color:var(--muted);font-size:12.5px;margin-left:6px;max-width:340px;line-height:1.3}
#dock .zoom{margin-left:auto;display:flex;gap:6px}
#dock .zoom button{height:36px;min-width:36px;padding:0 12px}
#editbar{position:fixed;z-index:25;top:62px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 8px 8px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 20px)}
#editbar span{opacity:.8;font-size:13px}
#ebName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#editbar button{height:32px;background:#2d3633;color:#fff;border-color:#46504c}
#editbar button.primary{background:var(--tape);border-color:var(--tape)}

/* stage and layers */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
.layer{position:absolute;left:0;right:0;transition:transform .85s cubic-bezier(.5,0,.2,1),opacity .6s}
#room{top:92px;bottom:64px;display:flex;align-items:center;justify-content:center}
#room.out{transform:scale(6.5);opacity:0;pointer-events:none}
#carousel{top:92px;bottom:64px}
#carousel.pre{transform:scale(.5);opacity:0;pointer-events:none}
#backdrop{position:absolute;z-index:5;inset:0;background:rgba(233,236,234,.82);opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(2px)}
#backdrop.on{opacity:1;pointer-events:auto}

/* room plan */
.plan{position:relative;box-sizing:content-box;background-color:#f6f4ee;border:6px solid #3a403d;border-radius:4px;
  background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);box-shadow:0 10px 30px rgba(20,30,25,.12)}
.plan .wl{position:absolute;font-size:12px;color:var(--muted);left:50%;transform:translateX(-50%);pointer-events:none}
.plan .wl.back{top:-30px}.plan .wl.front{bottom:-30px}
.plan .door{position:absolute;top:-6px;height:6px;background:#c98a4b}
.fp{position:absolute;border-radius:3px;cursor:grab;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;transition:box-shadow .2s,transform .2s}
.fp:hover{box-shadow:0 0 0 3px var(--tape)}
.fp.dragging{cursor:grabbing;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.fp .front{position:absolute;background:var(--tape);border-radius:2px;pointer-events:none}
.fp .f0{left:0;right:0;bottom:-3px;height:6px}.fp .f180{left:0;right:0;top:-3px;height:6px}
.fp .f90{top:0;bottom:0;right:-3px;width:6px}.fp .f270{top:0;bottom:0;left:-3px;width:6px}
.fpn{font-size:12.5px;font-weight:700;line-height:1.2;pointer-events:none;padding:2px}
.fpn.num{font-size:15px}
.fpn small{display:block;font-weight:500;opacity:.8;font-size:11px}
.fp.pulse{animation:fppulse .7s ease-in-out 6}
@keyframes fppulse{50%{box-shadow:0 0 0 8px rgba(255,212,38,.9)}}
#pop{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;box-shadow:0 14px 36px rgba(20,30,25,.22);cursor:pointer}
#pop h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#pop h4 span{font-weight:400;color:var(--muted);font-size:12.5px}

/* carousel */
.slide{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;transition:transform .75s cubic-bezier(.25,.8,.25,1),opacity .5s;will-change:transform}
.slide.side{cursor:pointer}
.slide.side .shelf{pointer-events:none}
.cap{margin-top:26px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px;text-align:center;white-space:nowrap}
.cap b{font-size:17px;margin-right:6px}.cap span{color:var(--muted)}
.cap button{height:30px;font-size:13px;padding:0 10px}
.slide.side .cap button{display:none}
.navbtn{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;transform:translateY(-50%);z-index:3;box-shadow:0 4px 12px rgba(20,30,25,.15)}
#prev{left:14px}#next{right:14px}
body[data-view=room] .navbtn,body.editing .navbtn,body.open .navbtn{display:none}

/* shelf */
.shelf{position:relative;background:color-mix(in srgb,var(--sc) 16%,#efebe2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.shelf::after{content:'';position:absolute;inset:-6px;border:7px solid var(--sc);border-radius:4px;pointer-events:none;box-shadow:0 12px 26px rgba(20,30,25,.18)}
.row{position:absolute;left:0;right:0}
.row::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--sc);pointer-events:none}
.comp{position:absolute;top:0;bottom:0;transition:background .15s}
.comp+.comp{box-shadow:inset 3px 0 0 var(--sc)}
.comp.drop{background:rgba(44,88,232,.2);outline:2px dashed var(--tape);outline-offset:-3px}
.comp .cn{position:absolute;left:5px;top:3px;font-size:10px;color:rgba(0,0,0,.35);font-weight:700;pointer-events:none}
.comp .dim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);border-radius:5px;padding:2px 6px;white-space:nowrap;pointer-events:none;animation:fadein .4s}
.rl{position:absolute;right:calc(100% + 26px);top:50%;transform:translateY(-50%);width:130px;text-align:right;font-size:12px;color:var(--muted);line-height:1.2;pointer-events:none}
.rl b{display:inline-block;background:var(--ink);color:#fff;border-radius:9px;min-width:20px;padding:1px 6px;text-align:center;margin-left:4px;font-size:11.5px}
.rl span{display:block}
@keyframes fadein{from{opacity:0}}
.shelf.mini::after{inset:-3px;border-width:4px;box-shadow:none}
.shelf.mini .row::after{height:3px}
.shelf.mini .comp+.comp{box-shadow:inset 2px 0 0 var(--sc)}

/* boxes */
.box{position:absolute;cursor:pointer;transition:opacity .3s,transform .3s}
.shelf.leaving .box{opacity:0;transform:translateY(14px) scale(.92)}
.skin{border-radius:3px;position:absolute;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.box.skin{position:absolute}
.t-box{background:linear-gradient(#c9a26c 0 14%,#b98d58 14%)}
.t-bin{background:linear-gradient(#a9b6c0 0 16%,#e6ecef 16%);border:2px solid #aeb9c1}
.t-crate{background:#aeb6bd;background-image:radial-gradient(circle,rgba(0,0,0,.3) 22%,transparent 25%);background-size:12px 12px;border:2px solid #8d969d}
.t-case{background:#cbbd9f;border:2px solid #8d8062}
.t-case::before,.t-case::after{content:'';position:absolute;top:-2px;width:10%;height:18%;background:#2d3134;border-radius:0 0 2px 2px}
.t-case::before{left:18%}.t-case::after{right:18%}
.t-device{background:#2f353b}
.t-device::after{content:'';position:absolute;right:7%;bottom:9%;width:5px;height:5px;border-radius:50%;background:#35d07f}
.box:hover{filter:brightness(1.06);transform:translateY(-2px)}
.box.dragsrc{opacity:.25}
.dropprev{position:absolute;border:2px dashed var(--tape);background:rgba(44,88,232,.18);border-radius:3px;pointer-events:none;z-index:3}
.dropprev.bad{border-color:var(--danger);background:rgba(198,55,44,.18)}
.mvgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}.mvgrid3 label{font-size:12px;color:var(--muted)}
.box.ghost{filter:drop-shadow(0 14px 14px rgba(0,0,0,.35));transform:scale(1.04);transition:none}
.tag{position:absolute;left:8%;right:8%;top:40%;background:#fff;border-left:4px solid var(--tape);padding:2px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.15;overflow:hidden;color:#10161a;border-radius:1px;pointer-events:none}
.tag b,.tag small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag small{color:#55605b;font-size:.78em}
.box.pulse{animation:boxpulse .7s ease-in-out 6;z-index:4}
@keyframes boxpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,212,38,0);outline:3px solid var(--mark)}50%{box-shadow:0 0 0 10px rgba(255,212,38,.6);outline:3px solid var(--mark)}}

/* edit handles */
.handle{position:absolute;z-index:3;animation:fadein .4s}
.handle::after{content:'';position:absolute;background:var(--tape);opacity:.28;border-radius:2px;transition:opacity .15s}
.handle.hv{cursor:col-resize}.handle.hv::after{left:7px;right:7px;top:0;bottom:0}
.handle.hh{cursor:row-resize}.handle.hh::after{top:7px;bottom:7px;left:0;right:0}
.handle:hover::after,.handle.on::after{opacity:1}
.handle::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;border:2px solid var(--tape);z-index:1}
.guide{position:absolute;pointer-events:none;background:var(--mark);box-shadow:0 0 0 1px #b79a00;z-index:2}
#dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:8px;white-space:nowrap}
#dragtip .tb{display:flex;height:6px;gap:2px;margin:6px 0 2px;min-width:120px}
#dragtip .tb i{display:block;background:#8aa0ff;border-radius:2px}#dragtip .tb i+i{background:#ffd426}
#dragtip em{font-style:normal;color:var(--mark)}

/* open box */
#boxview{position:absolute;z-index:6;inset:0;pointer-events:none}
.ob{position:fixed;perspective:900px;pointer-events:auto;transition:transform .7s cubic-bezier(.3,.8,.25,1)}
.ob-body{left:0;right:0;bottom:0;z-index:2;cursor:default}
.ob-lid{left:0;right:0;top:0;z-index:3;transform-origin:50% 100%;transition:transform .65s cubic-bezier(.3,.9,.3,1);background:var(--lid);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.ob.open .ob-lid{transform:rotateX(-114deg)}
.ob-items{position:absolute;inset:0;z-index:1}
.tile{position:absolute;top:0;border-radius:7px;color:#10161a;font-size:11.5px;font-weight:600;line-height:1.1;padding:5px;display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 3px 8px rgba(0,0,0,.2);transform:translateY(70px) scale(.4);opacity:0;transition:transform .55s cubic-bezier(.2,1.25,.3,1),opacity .3s;overflow:hidden}
.tile.up{transform:translateY(var(--ty)) scale(1);opacity:1}
.tile.hit{outline:3px solid var(--mark);box-shadow:0 0 0 6px rgba(255,212,38,.45)}
.tile small{position:absolute;right:3px;bottom:2px;font-size:10px;opacity:.7}
.ob-more{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted)}

/* panel */
#panel{position:fixed;z-index:25;top:64px;right:10px;bottom:10px;width:min(384px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px;overflow:auto;box-shadow:0 14px 40px rgba(20,30,25,.2);transform:translateX(calc(100% + 24px));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#panel.on{transform:none}
#panel .ph{display:flex;gap:8px;align-items:center}
#panel .ph select{flex:1;font-size:13px}
#panel .x{width:38px;padding:0;font-size:22px;line-height:1}
#panel .title{font-size:21px;font-weight:700;margin:10px 0 12px;border-color:transparent;padding-left:4px;background:transparent}
#panel .title:hover,#panel .title:focus{border-color:var(--line);background:#fff}
.where{display:flex;gap:14px;align-items:center;padding:12px;border-radius:8px;background:#eef2ef;margin-bottom:8px}
.where div span{display:block;font-size:13.5px;color:var(--muted)}
.where div b{display:block;font-size:15px}
.mm{display:flex;flex-direction:column;gap:2px;width:84px;flex:none}
.mm.s{width:46px;gap:1px}
.mm .mr{display:flex;gap:2px;min-height:0}.mm.s .mr{gap:1px}
.mm i{display:block;background:#d5dcd8;border-radius:2px}
.mm i.occ{background:#aeb9b3}.mm i.me{background:var(--mark);outline:2px solid var(--ink);outline-offset:-1px;z-index:1}
details.mv{margin:0 0 6px}
details.mv summary{cursor:pointer;color:var(--tape);font-size:14px;padding:6px 2px}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.mvgrid label{font-size:12px;color:var(--muted)}
h3{margin:14px 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline}
h3 em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px}
ul#items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul#items li{display:grid;grid-template-columns:1fr 64px 34px;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff}
ul#items li.hit{background:#fff4b8;border-color:#e6c200;box-shadow:inset 4px 0 var(--mark)}
ul#items li input{min-height:32px;padding:4px 8px;border-color:transparent}
ul#items li input:hover,ul#items li input:focus{border-color:var(--line)}
ul#items li .note{grid-column:1/-1;font-size:13px;color:var(--muted);min-height:28px}
ul#items li button{height:32px;padding:0}
.addrow{display:grid;grid-template-columns:1fr 64px auto;gap:4px;margin-top:8px}
.linkbtn{border:0;background:none;color:var(--tape);height:auto;padding:6px 2px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}

/* context menu, modal, toast */
#ctx{position:fixed;z-index:70;display:none;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 14px 36px rgba(20,30,25,.25)}
#ctx button{display:block;width:100%;height:32px;border:0;text-align:left;background:transparent;padding:0 10px;border-radius:5px;font-size:14px}
#ctx button:hover:not(:disabled){background:#eef2ef}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#modal{position:fixed;inset:0;z-index:80;background:rgba(20,28,24,.45);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .sheet{width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border-radius:10px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal h2{margin:0 0 14px;font-size:20px}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--muted);margin:6px 0}
#toast{position:fixed;z-index:90;left:50%;bottom:64px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}

.steps{display:flex;gap:6px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.steps span{padding:3px 9px;border-radius:12px;background:#e3e8e5}
.steps span.on{background:var(--ink);color:#fff}.steps span.done{background:#cfe0d6;color:var(--ink)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chipsel button{height:34px;font-size:13px}
.chipsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pickshelf{display:flex;justify-content:center;padding:10px 6px 14px;overflow:auto}
.pickshelf .comp{cursor:pointer}
.pickshelf .comp:hover{background:rgba(44,88,232,.2)}
.pickshelf .comp.sel{background:rgba(255,212,38,.5);outline:3px solid var(--mark);outline-offset:-3px}
.pickshelf .box{pointer-events:none}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.typegrid button{height:auto;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.typegrid button:hover,.typegrid button.on{border-color:var(--tape);box-shadow:0 0 0 2px rgba(44,88,232,.25)}
.typegrid small{color:var(--muted);font-size:12px}
.typegrid .tp{position:relative;width:84px;height:58px;display:block;margin-bottom:4px}
.typegrid .tp .skin{left:8px;right:8px;bottom:2px;top:8px;position:absolute}
.msg a{color:var(--tape)}
@media(max-width:820px){
  header{gap:6px;top:8px;left:8px;right:8px}
  .brand{display:none}
  .search{min-width:0;max-width:none}
  .search input{height:40px}
  #bAdd{height:40px;padding:0 12px;white-space:nowrap}
  #sync{height:40px;width:40px;padding:0;justify-content:center}
  #sync span{display:none}
  #sync i{width:12px;height:12px}
  #crumbs{top:56px;left:8px;right:8px;overflow-x:auto;white-space:nowrap}
  #crumbs b{max-width:50vw;overflow:hidden;text-overflow:ellipsis}
  #room,#carousel{top:96px;bottom:104px}
  #dock{left:8px;right:8px;bottom:8px;flex-wrap:wrap;gap:6px}
  #dock .hint{display:none}
  #dock .chips{order:1;flex-wrap:nowrap;overflow-x:auto;max-width:none;width:100%;padding-bottom:2px;scrollbar-width:none}
  #dock .chips::-webkit-scrollbar{display:none}
  #dock .chips button{flex:none;height:36px}
  #dock .zoom{order:2;margin-left:0;width:100%;justify-content:flex-end}
  #dock .zoom button{height:40px;min-width:44px}
  #editbar{top:56px;left:8px;right:8px;transform:none;justify-content:space-between}
  #editbar span{display:none}

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const sheetMode=()=>innerWidth<=820&&innerHeight>innerWidth;
const sleep=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
const rnd=v=>Math.round(v*2)/2;                 // half-inch
const fmt=v=>String(Math.round(v*10)/10);
const sgn=d=>(d>=0?'+':'−')+fmt(Math.abs(d));
const STORE='inv.data.v2', CFG='inv.cfg.v1', DIRTY='inv.dirty.v1';
const TYPES={
  box:{name:'Cardboard box',size:[16,12],lid:'#c9a26c'},
  bin:{name:'Bin or tub',size:[17,11],lid:'#a9b6c0'},
  crate:{name:'Crate or basket',size:[14,9],lid:null},
  case:{name:'Hard case',size:[22,13],lid:'#b2a27c'},
  device:{name:'Device or loose gear',size:[13,12],lid:null}
};
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const ink=hex=>{const c=hex.replace('#','');const n=parseInt(c.length===3?c.replace(/./g,'$&$&'):c,16);const l=(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255;return l>.62?'#1b2220':'#fff'};

/* ================= data model ================= */
function mkUnit(id,name,side,w,h,d,x,y,rot,color,rows){
  return {id,name,side,w,h,d,x,y,rot,color,rows:rows.map(([label,rh,cols])=>({id:uid(),h:rh,label,cols:cols.map(cw=>({id:uid(),w:cw}))}))};
}
function seedData(){
  const units=[
    mkUnit('closet','Closet','Back wall, left side',56,84,24,14,0,0,'#c98a4b',[['Top shelf above rod',14,[18,20,18]],['Network ledge',8,[28,28]],['Shelf 1',10,[14,14,14,14]],['Shelf 2',12,[14,14,14,14]],['Shelf 3',12,[14,14,14,14]],['Shelf 4',12,[20,18,18]],['Floor',16,[14,14,14,14]]]),
    mkUnit('black','Black shelf','Back wall, right of closet',36,36,18,80,0,0,'#2a2e33',[['Top',10,[12,12,12]],['Middle',12,[18,18]],['Bottom',14,[36]]]),
    mkUnit('cart','Printer cart','Back wall, next to door',20,28,16,124,0,0,'#7b8288',[['Top (printer)',10,[20]],['Middle',8,[20]],['Bottom',10,[20]]]),
    mkUnit('corner','Window corner shelf','Left wall, by the window',34,46,14,0,60,90,'#2a2e33',[['Top',12,[17,17]],['Upper middle',12,[17,17]],['Lower middle',10,[34]],['Bottom',12,[17,17]]])
  ];
  const containers=[];
  const put=(uid_,r,c,name,type,items=[])=>{const u=units.find(x=>x.id===uid_),row=u.rows[r-1];
    containers.push({id:uid(),name,type,unit:u.id,rid:row.id,cid:row.cols[c-1].id,notes:'',items:items.map(n=>({id:uid(),name:n[0],qty:n[1]||1,notes:''}))})};
  put('closet',1,1,'Dell tower PCs','device');put('closet',1,2,'HP desktop PCs','device');put('closet',1,3,'HP tower PC','device');
  put('closet',2,1,'Routers and modems','device');put('closet',2,2,'Patch panel and switch','device');
  put('closet',3,1,'Crate 1','crate');put('closet',3,2,'Crate 2','crate');put('closet',3,2,'Crate 3','crate');put('closet',3,3,'Crate 4','crate');put('closet',3,3,'Crate 5','crate');put('closet',3,4,'Crate 6','crate');
  put('closet',4,1,'Small white bin','bin');put('closet',4,2,'Large white tub','bin');put('closet',4,3,'Black wire basket','crate');put('closet',4,4,'White bin right','bin');
  put('closet',5,1,'iPad boxes','box');put('closet',5,2,'Blue basket','crate');put('closet',5,3,'Amazon box A','box');put('closet',5,3,'Amazon box B','box');put('closet',5,4,'Amazon box C','box');
  put('closet',6,1,'Shipping box (Made in China)','box');put('closet',6,2,'Power supplies and docks','device');put('closet',6,3,'Laptop stack','device');put('closet',6,3,'TP-Link boxes','box');
  put('closet',7,1,'Open shipping box','box');put('closet',7,2,'Pelican case 1','case');put('closet',7,4,'Pelican case 2','case');
  put('black',1,1,'ASUS laptop boxes','box');put('black',1,2,'Keyboard and mouse','device');
  put('black',2,1,'Large Amazon box','box');put('black',2,2,'Amazon box','box');
  put('black',3,1,'Chromebooks stack 1','device');put('black',3,1,'Chromebooks stack 2','device');put('black',3,1,'Chromebooks stack 3','device');
  put('cart',1,1,'Canon imageRUNNER','device');put('cart',2,1,'Small cardboard box','box');put('cart',3,1,'Amazon box and small printer','box');
  put('corner',1,1,'Black storage box','box');put('corner',1,2,'Latching tub','bin',[['Canon GPR-35 toner'],['TV wall mount 13-90 in']]);
  put('corner',2,1,'Power cords tub','bin');put('corner',2,2,'Green cabbage crate','crate');
  put('corner',3,1,'Black cases','device');put('corner',4,1,'Chromebooks in bubble wrap','device');put('corner',4,2,'Box with Acer Chromebook','box',[['Acer Chromebook']]);
  return {room:{w:216,d:168},units,containers};
}
let state=(()=>{try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.units&&s.units.length&&s.units[0].rows)return s}catch(e){}return seedData()})();

const U=id=>state.units.find(u=>u.id===id), C=id=>state.containers.find(c=>c.id===id);
const rIdx=(u,rid)=>u.rows.findIndex(r=>r.id===rid), cIdx=(r,cid)=>r.cols.findIndex(c=>c.id===cid);
const rowOf=(u,rid)=>u.rows.find(r=>r.id===rid);
const sum=a=>a.reduce((x,y)=>x+y,0);
function repair(){
  state.units.forEach(u=>{
    const th=sum(u.rows.map(r=>r.h));if(Math.abs(th-u.h)>.01)u.rows.forEach(r=>r.h*=u.h/th);
    u.rows.forEach(r=>{const tw=sum(r.cols.map(c=>c.w));if(Math.abs(tw-u.w)>.01)r.cols.forEach(c=>c.w*=u.w/tw)});
  });
  state.containers.forEach(c=>{const u=U(c.unit)||state.units[0];c.unit=u.id;const r=rowOf(u,c.rid)||u.rows[0];c.rid=r.id;if(!r.cols.some(x=>x.id===c.cid))c.cid=r.cols[0].id});
  placeMissing();
}
function locParts(c){
  const u=U(c.unit),ri=rIdx(u,c.rid),r=u.rows[ri],ci=cIdx(r,c.cid);
  return {u,r,ri,ci,unit:u.name,side:u.side,row:`Row ${ri+1} of ${u.rows.length}`,label:r.label||'',col:r.cols.length>1?`Column ${ci+1} of ${r.cols.length}`:'Whole row (no columns)'};
}
const locText=c=>{const p=locParts(c);return `${p.unit} | ${p.side} | ${p.row} from top${p.label?` (${p.label})`:''} | ${p.col}${p.r.cols.length>1?' from left':''}`};
const compLabel=(u,r,ri,ci)=>`Row ${ri+1}${r.label?' · '+r.label:''} · ${r.cols.length>1?'Column '+(ci+1):'whole row'}`;
const compOptions=(u,rid,cid)=>u.rows.map((r,ri)=>r.cols.map((cl,ci)=>`<option value="${r.id}|${cl.id}" ${r.id===rid&&cl.id===cid?'selected':''}>${esc(compLabel(u,r,ri,ci))}</option>`).join('')).join('');
const footprint=u=>(u.rot%180===0)?{w:u.w,h:u.d}:{w:u.d,h:u.w};

/* undo */
const undoStack=[];
function undoPush(){undoStack.push(JSON.stringify(state));if(undoStack.length>40)undoStack.shift()}
function undoPop(){const s=undoStack.pop();if(!s){toast('Nothing to undo');return}state=JSON.parse(s);repair();save();ui.cur=Math.min(ui.cur,state.units.length-1);if(ui.edit&&!U(ui.edit))ui.edit=null;renderAll()}

/* sheet format */
function serialize(){
  return {version:2,room:state.room,
    units:state.units.map(u=>({id:u.id,name:u.name,side:u.side,w:u.w,h:u.h,d:u.d,x:u.x,y:u.y,rot:u.rot,color:u.color,
      layout:JSON.stringify({rows:u.rows.map(r=>({h:r.h,label:r.label||'',cols:r.cols.map(c=>c.w)}))})})),
    containers:state.containers.map(c=>{const p=locParts(c);return {id:c.id,name:c.name,type:c.type,unit:c.unit,row:p.ri+1,col:p.ci+1,notes:c.notes,location:locText(c),x:c.x==null?'':c.x,lv:c.lv||0,w:c.w||'',h:c.h||'',items:c.items}})};
}
function deserialize(d){
  if(!d||!Array.isArray(d.units)||!d.units.length)return null;
  const units=d.units.map(u=>{
    let lay=u.layout;if(typeof lay==='string'){try{lay=JSON.parse(lay)}catch(e){lay=null}}
    const w=+u.w||36,h=+u.h||48;
    const rowsIn=lay&&Array.isArray(lay.rows)&&lay.rows.length?lay.rows:[{h,label:'',cols:[w]}];
    const nu={id:String(u.id||uid()),name:String(u.name||'Shelf'),side:String(u.side||''),w,h,d:+u.d||16,x:+u.x||0,y:+u.y||0,rot:((+u.rot||0)%360+360)%360,color:String(u.color||'#9a8f80'),
      rows:rowsIn.map(r=>({id:uid(),h:+r.h||12,label:String(r.label||''),cols:(Array.isArray(r.cols)&&r.cols.length?r.cols:[w]).map(cw=>({id:uid(),w:+cw||10}))}))};
    return nu;
  });
  const containers=(d.containers||[]).map(c=>{
    const u=units.find(x=>x.id===String(c.unit))||units[0];
    const r=u.rows[clamp((parseInt(c.row)||1)-1,0,u.rows.length-1)],cl=r.cols[clamp((parseInt(c.col)||1)-1,0,r.cols.length-1)];
    return {id:String(c.id||uid()),name:String(c.name||'Untitled'),type:TYPES[c.type]?c.type:'box',unit:u.id,rid:r.id,cid:cl.id,notes:String(c.notes||''),
      x:(c.x===''||c.x==null||!Number.isFinite(+c.x))?null:+c.x,lv:parseInt(c.lv)||0,w:+c.w>0?+c.w:undefined,h:+c.h>0?+c.h:undefined,
      items:(c.items||[]).filter(i=>String(i.name||'').trim()).map(i=>({id:String(i.id||uid()),name:String(i.name),qty:(i.qty===''||i.qty==null)?1:(Number(i.qty)||0),notes:String(i.notes||'')}))};
  });
  const room=d.room&&+d.room.w>0&&+d.room.d>0?{w:+d.room.w,d:+d.room.d}:{w:216,d:168};
  const s={room,units,containers};return s;
}

/* ================= sync ================= */
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch(e){return {}}};
let syncTimer=null,syncBusy=false;
function setSync(kind,text){const b=$('#sync');b.className=kind;$('span',b).textContent=text}
function refreshSyncChip(){if(!cfg().url)setSync('','Local only');else if(localStorage.getItem(DIRTY))setSync('busy','Unsaved to sheet');else setSync('ok','Sheet synced')}
function updateCount(){$('#count').textContent=`${state.containers.length} boxes · ${sum(state.containers.map(c=>c.items.length))} items`}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}
  updateCount();
  if(cfg().url){localStorage.setItem(DIRTY,'1');refreshSyncChip();clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}
}
async function push(){
  const c=cfg();if(!c.url)return;
  if(syncBusy){syncTimer=setTimeout(push,1500);return}
  syncBusy=true;setSync('busy','Saving to sheet…');
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token||'',data:serialize()})});
    const j=await r.json();if(j.error)throw new Error(j.error);
    localStorage.removeItem(DIRTY);setSync('ok','Sheet synced');return true;
  }catch(e){setSync('err','Sync failed, tap to retry');console.error(e);return false}
  finally{syncBusy=false}
}
async function pull(){
  const c=cfg();if(!c.url)return;
  setSync('busy','Loading from sheet…');
  try{
    const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'token='+encodeURIComponent(c.token||''));
    const j=await r.json();if(j.error)throw new Error(j.error);
    const n=deserialize(j);
    if(!n){toast('The sheet is empty, so your current data was sent to it.');await push();return}
    state=n;try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}localStorage.removeItem(DIRTY);
    resetUi();renderAll();setSync('ok','Sheet synced');toast('Loaded from Google Sheet');
  }catch(e){setSync('err','Sync failed, tap to retry');console.error(e);toast('Could not reach the sheet. Check the URL, token, and that access is set to Anyone.')}
}

/* ================= ui state ================= */
const ui={view:'room',cur:0,edit:null,open:null,focusItem:null,pulse:null,pulseUntil:0,ks:{},guide:null,rs:1};
const stage=$('#stage'),roomEl=$('#room'),carEl=$('#carousel');
function resetUi(){ui.open=null;ui.edit=null;ui.cur=0;ui.view='room';$('#panel').classList.remove('on');$('#backdrop').classList.remove('on');$('#boxview').innerHTML='';
  roomEl.classList.remove('out');carEl.classList.add('pre');$('#editbar').hidden=true;document.body.classList.remove('open','editing')}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),3400)}
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

/* ================= shelf rendering ================= */
const BOARD=.9;
const wOf=c=>c.w||TYPES[c.type].size[0], hOf=c=>c.h||TYPES[c.type].size[1];
const r1=v=>Math.round(v*10)/10;
/* gravity layout: every box has x (inches from the left of its spot) and lv (stack level). y is computed. */
function layoutComp(list,W,H){
  const items=list.map(c=>{const w=Math.min(wOf(c),W-.4),h=Math.min(hOf(c),Math.max(2,H-BOARD-.3));return {c,w,h,x:clamp(Number.isFinite(c.x)?c.x:0,0,Math.max(0,W-w)),lv:c.lv||0,y:0}});
  items.sort((p,q)=>p.lv-q.lv||p.x-q.x);
  const placed=[];
  items.forEach(o=>{let y=0;placed.forEach(q=>{if(Math.min(o.x+o.w,q.x+q.w)-Math.max(o.x,q.x)>.25)y=Math.max(y,q.y+q.h)});o.y=y;placed.push(o)});
  return items;
}
function packBoxes(list,W,H){
  const n=list.length;if(!n)return {pl:[],s:1};
  let best=null,one=null;
  for(let t=1;t<=Math.min(n,4);t++){
    const per=Math.ceil(n/t),tiers=[];for(let i=0;i<n;i+=per)tiers.push(list.slice(i,i+per));
    const maxW=Math.max(...tiers.map(g=>sum(g.map(wOf)))),maxH=Math.max(...list.map(hOf));
    const sc=Math.max(.15,Math.min(1,(W-1)/maxW,(H-BOARD-.5)/(tiers.length*maxH)));
    if(t===1)one={s:sc,tiers};
    if(!best||sc>best.s+.001)best={s:sc,tiers};
  }
  if(one&&one.s>=.65)best=one;   // prefer boxes side by side unless that makes them tiny
  const pl=[];let y=0;
  best.tiers.forEach((g,t)=>{
    const tw=sum(g.map(wOf))*best.s,gap=Math.max(0,(W-tw)/(g.length+1));let x=gap,th=0;
    g.forEach(c=>{const w=wOf(c)*best.s,h=hOf(c)*best.s;pl.push({c,x,y,w,h,t});x+=w+gap;th=Math.max(th,h)});y+=th;
  });
  return {pl,s:best.s};
}
function applyPack(list,W,H){
  const {pl,s:sc}=packBoxes(list,W,H);
  pl.forEach(b=>{b.c.x=r1(b.x);b.c.lv=b.t;if(sc<.999){b.c.w=r1(b.w);b.c.h=r1(b.h)}});
}
function autoPlace(c,W,H,all){
  let w=wOf(c),h=hOf(c);const mw=W-.4,mh=Math.max(2,H-BOARD-.3);
  if(w>mw||h>mh){const k=Math.min(mw/w,mh/h);c.w=r1(w*k);c.h=r1(h*k);w=c.w;h=c.h}
  const rest=all.filter(o=>o!==c&&o.x!=null),others=layoutComp(rest,W,H),floor=others.filter(o=>o.y<.01).sort((p,q)=>p.x-q.x);
  let x=null,cur=0;
  for(const o of floor){if(o.x-cur>=w+.4){x=cur+(cur>0?.4:.2);break}cur=Math.max(cur,o.x+o.w)}
  if(x===null&&W-cur>=w+.4)x=cur+(cur>0?.4:.2);
  if(x!==null){c.x=r1(Math.min(x,W-w));c.lv=0;return}
  for(const o of others.slice().sort((p,q)=>(p.y+p.h)-(q.y+q.h))){
    const xx=clamp(o.x,0,W-w),lv=(o.c.lv||0)+1,me={id:c.id,type:c.type,w:c.w,h:c.h,x:xx,lv};
    const mine=layoutComp([...rest,me],W,H).find(i=>i.c===me);
    if(mine&&mine.y+mine.h<=H-BOARD+.01){c.x=r1(xx);c.lv=lv;return}
  }
  c.x=0;c.lv=0;
}
function placeMissing(){
  const groups={};
  state.containers.forEach(c=>{if(c.x==null||!Number.isFinite(c.x))(groups[c.unit+'|'+c.rid+'|'+c.cid]=groups[c.unit+'|'+c.rid+'|'+c.cid]||[]).push(c)});
  for(const key in groups){

    const cand=[[0,'the left edge'],[W-w,'the right edge']];
    others.forEach(o=>cand.push([o.x+o.w,o.c.name],[o.x-w,o.c.name],[o.x,o.c.name],[o.x+o.w-w,o.c.name]));

const qEl=$('#q'),resEl=$('#results');let hits=[],sel=-1;
function runSearch(){
  const raw=qEl.value.trim().toLowerCase();hits=[];sel=-1;
  if(!raw){resEl.classList.remove('on');return}
  const tk=raw.split(/\s+/);
  for(const c of state.containers){
    const cn=(c.name+' '+c.notes).toLowerCase();
    c.items.forEach(it=>{const hay=it.name+' '+it.notes+' '+cn;if(tk.every(t=>hay.toLowerCase().includes(t))){const n=it.name.toLowerCase();hits.push({c,it,score:n===raw?0:n.startsWith(raw)?1:n.includes(raw)?2:3})}});
    if(tk.every(t=>cn.includes(t)))hits.push({c,it:null,score:4});
  }
  hits.sort((a,b)=>a.score-b.score);hits=hits.slice(0,30);
  const re=new RegExp('('+tk.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');
  const hl=s=>esc(s).replace(re,'<mark>$1</mark>');
  resEl.innerHTML=hits.length?hits.map((h,i)=>{
    const p=locParts(h.c);
    return `<button class="hitrow" data-i="${i}" role="option">${miniMap(p.u,h.c,true)}<div><div class="t">${h.it?hl(h.it.name):hl(h.c.name)}${h.it&&h.it.qty>1?` <span style="font-weight:400;color:var(--muted)">×${h.it.qty}</span>`:''}</div>
    <div class="s">${h.it?`in <b>${hl(h.c.name)}</b>`:'Box or bin'}</div>
    <div class="chips"><span class="chip tape">${esc(p.unit)}</span><span class="chip">${esc(p.side)}</span><span class="chip">${p.row}${p.label?' · '+esc(p.label):''}</span><span class="chip">${p.col}</span></div></div></button>`}).join('')
    :`<div class="none">Nothing matches “${esc(qEl.value)}”. Try fewer words, or add it to a box.</div>`;
  resEl.classList.add('on');
}
function chooseHit(i){const h=hits[i];if(!h)return;resEl.classList.remove('on');qEl.blur();goToBox(h.c.id,h.it&&h.it.id)}
qEl.addEventListener('input',runSearch);qEl.addEventListener('focus',runSearch);
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=clamp(sel+(e.key==='ArrowDown'?1:-1),0,hits.length-1);$$('.hitrow',resEl).forEach((b,i)=>{b.classList.toggle('sel',i===sel);if(i===sel)b.scrollIntoView({block:'nearest'})})}
  else if(e.key==='Enter'){e.preventDefault();chooseHit(sel>=0?sel:0)}
  else if(e.key==='Escape'){resEl.classList.remove('on');qEl.blur()}
});

  <div class="f"><label for="sU">Web app URL</label><input id="sU" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="f"><label for="sT">Token</label><input id="sT" type="password" value="${esc(c.token||'')}" autocomplete="off"></div>
  <div class="btns" style="justify-content:flex-start"><button id="sSave" class="primary">Save and connect</button><button id="sPull">Load from sheet</button><button id="sPush">Send to sheet</button></div>
  <h2 style="margin-top:22px">Backup</h2>
  <div class="btns" style="justify-content:flex-start"><button id="sExp">Download backup (JSON)</button><button id="sImp">Restore from backup</button><button id="sReset" class="danger">Reset to starter layout</button></div>
  <input id="sFile" type="file" accept="application/json" hidden>
  <div class="btns"><button id="sClose">Done</button></div>`);
  const store=()=>localStorage.setItem(CFG,JSON.stringify({url:$('#sU',s).value.trim(),token:$('#sT',s).value}));
  $('#sSave',s).onclick=async()=>{store();closeModal();if(cfg().url){if(localStorage.getItem(DIRTY))await push();else await pull()}else refreshSyncChip()};
  $('#sPull',s).onclick=async()=>{store();closeModal();await pull()};
  $('#sPush',s).onclick=async()=>{store();closeModal();const ok=await push();if(ok)toast('Sent to Google Sheet')};
  $('#sClose',s).onclick=closeModal;
  $('#sExp',s).onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'}));a.download=`tech-inventory-${new Date().toISOString().slice(0,10)}.json`;a.click()};
  $('#sImp',s).onclick=()=>$('#sFile',s).click();
  $('#sFile',s).onchange=async e=>{try{const n=deserialize(JSON.parse(await e.target.files[0].text()));if(!n)throw 0;undoPush();state=n;save();closeModal();resetUi();renderAll();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}};
  $('#sReset',s).onclick=()=>{if(confirm('Replace everything with the starter layout?')){undoPush();state=seedData();save();closeModal();resetUi();renderAll()}};
}
$('#bAdd').onclick=()=>addBoxModal();
$('#sync').onclick=()=>{if(!cfg().url)settingsModal();else if(localStorage.getItem(DIRTY)||$('#sync').classList.contains('err'))push();else settingsModal()};
$('#sync').addEventListener('contextmenu',e=>{e.preventDefault();settingsModal()});
$('.brand').addEventListener('dblclick',settingsModal);
carEl.addEventListener('click',e=>{const b=e.target.closest('[data-act=editlayout]');if(b)enterEdit(b.closest('.slide').dataset.unit)});

/* ================= keys & boot ================= */
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();qEl.focus()}
  else if(e.key==='Escape'){if(modalEl.classList.contains('on'))closeModal();else if(ctxEl.style.display==='block')hideCtx();else if(!typing)zoomOut()}
  else if(!typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))cycle(e.key==='ArrowLeft'?-1:1);
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!typing){e.preventDefault();undoPop()}
});
function renderAll(){
  repair();renderCarousel();renderRoom();updateCount();updateCrumbs();updateDock();
  if(ui.edit)$('#ebName').textContent=`Editing ${U(ui.edit)?U(ui.edit).name:''}`;
  if(ui.open)renderPanel();
}
let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{renderAll()},150)});
renderAll();refreshSyncChip();
if(cfg().url){if(localStorage.getItem(DIRTY))push();else pull()}
})();
</script>
</body>
</html>
